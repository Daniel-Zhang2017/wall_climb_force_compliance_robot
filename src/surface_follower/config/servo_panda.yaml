moveit_servo:
  ros__parameters:
    move_group_name: "panda_arm"
    planning_frame: "panda_link0"
    ee_frame_name: "panda_link8"
    robot_link_command_frame: "panda_link0"
    is_primary_planning_scene_monitor: true

    command_in_type: "speed_units"
    cartesian_command_in_topic: "/servo_node/delta_twist_cmds"

    command_out_topic: "/panda_arm_controller/joint_trajectory"
    command_out_type: "trajectory_msgs/JointTrajectory"
    publish_joint_positions: true
    publish_joint_velocities: false
    publish_joint_accelerations: false

    joint_topic: "/joint_states"

    max_vel: 0.5
    max_accel: 1.0
    max_vel_stop: 0.01
    max_accel_stop: 0.05

    collision_check_type: "none"
    self_collision_proximity_threshold: 0.01
    scene_collision_proximity_threshold: 0.02
    collision_slowdown_factor: 0.2

    smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"
    low_pass_filter_coeff: 0.05

    publish_period: 0.01
    incoming_command_timeout: 0.2

    joint_limit_margin: 0.1
    override_velocity_scaling_factor: 0.3
