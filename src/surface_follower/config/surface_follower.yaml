surface_follower_node2:
  ros__parameters:
    use_sim_time: false
    target_force_z: -15.0
    kp_force: 0.02
    max_vel: 0.15
    force_deadzone: 0.5
    marker_length: 0.15
    enable_gravity_compensation: false
    gravity_force: [0.0, 0.0, -9.81]
    sweep_speed: 0.03
    enable_sweep: true
    sweep_bounds: 0.4
    # 对接MoveIt Servo新增参数
    servo_twist_topic: "/servo_node/delta_twist_cmds"
    sensor_frame: "ft_sensor_link"
    planning_frame: "panda_link0"
    ee_frame: "panda_link8"
    force_estop_threshold: -25.0

